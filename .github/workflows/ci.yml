# Mỗi lần đẩy code: kiểm tra phong cách, nội dung lịch sử, chơi hết game bằng bot, chạy API với PostgreSQL thật.
name: Kiểm thử

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sukydieutra
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: sukydieutra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sukydieutra"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sukydieutra:devpassword@localhost:5432/sukydieutra
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          pip install ./backend[dev] pygame-ce==2.5.7
      - name: Kiểm tra phong cách code
        run: ruff check backend game tools shared
      - name: Kiểm tra nội dung lịch sử
        run: python tools/check_content.py
      - name: Chơi hết game bằng bot
        run: python -m pytest game/tests -q -p no:cacheprovider
      - name: Tạo cơ sở dữ liệu
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Kiểm thử API
        working-directory: backend
        run: python -m pytest tests -q -p no:cacheprovider
