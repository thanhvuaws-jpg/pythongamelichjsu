# PostgreSQL cho phát triển local. Chạy: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sukydieutra
      POSTGRES_PASSWORD: devpassword # chỉ dùng local
      POSTGRES_DB: sukydieutra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukydieutra"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
