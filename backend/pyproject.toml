[project]
name = "sukydieutra-backend"
version = "0.1.0"
description = "Backend_API + Admin_Portal cho game Sử Ký Điều Tra"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pydantic-settings==2.16.2",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    "authlib==1.9.1",
    "slowapi==0.1.10",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "hypothesis==6.170.14",
    "ruff==0.17.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "../shared/tests"]
# Cho phép `import shared` từ thư mục gốc repo
pythonpath = [".", ".."]
