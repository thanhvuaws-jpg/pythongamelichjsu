<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu: Sử Ký Điều Tra</title>
  <link rel="icon" href="img/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Serif:wght@400;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=10">
</head>
<body class="backdrop">
  <nav class="bar" id="bar"></nav>
  <main>
    <form class="sheet box paper" id="form">
      <h1>Quên mật khẩu</h1>
      <p class="lead">Nhập email của tài khoản, chúng tôi gửi liên kết để bạn đặt mật khẩu mới.</p>
      <p class="notice" id="msg" role="alert" hidden></p>
      <label class="field">Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <button class="btn gold" type="submit">Gửi liên kết</button>
      <p class="after"><a href="login.html">Quay lại đăng nhập</a></p>
    </form>
  </main>
  <script src="js/api.js?v=8"></script>
  <script>
    SK.renderBar(null);
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const out = await SK.call("/auth/password-reset/request", { method: "POST", body: { email: event.target.email.value } });
        SK.show("msg", out.message);
      } catch (err) {
        SK.show("msg", err.status === 422 ? "Email chưa đúng định dạng." : err.message, true);
      }
    });
  </script>
</body>
</html>
