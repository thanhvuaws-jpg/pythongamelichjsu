<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt mật khẩu mới: Sử Ký Điều Tra</title>
  <link rel="icon" href="img/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Serif:wght@400;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=10">
</head>
<body class="backdrop">
  <nav class="bar" id="bar"></nav>
  <main>
    <form class="sheet box paper" id="form">
      <h1>Đặt mật khẩu mới</h1>
      <p class="notice" id="msg" role="alert" hidden></p>
      <label class="field">Mật khẩu mới
        <span class="hint">Tối thiểu 8 ký tự.</span>
        <input name="password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button class="btn gold" type="submit">Lưu mật khẩu</button>
      <p class="after"><a href="login.html">Quay lại đăng nhập</a></p>
    </form>
  </main>
  <script src="js/api.js?v=8"></script>
  <script>
    SK.renderBar(null);
    const token = new URLSearchParams(location.search).get("token") || "";
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const out = await SK.call("/auth/password-reset/confirm", { method: "POST", body: { token, new_password: event.target.password.value } });
        SK.show("msg", out.message);
      } catch (err) {
        SK.show("msg", err.status === 422 ? "Liên kết không đúng, hãy mở lại từ email." : err.message, true);
      }
    });
  </script>
</body>
</html>
